# ============================================================================
#  Alias de ficheros JSON -> fichero real. Sirven tanto para los cuerpos de la
#  peticion como para las respuestas esperadas, asi que se separan por carpetas:
#      jsons/Body/<ambito>/<caso>.json      -> lo que se envia
#      jsons/Response/<ambito>/<caso>.json  -> lo que se espera recibir
#  En las features se pasa el alias, no la ruta. El nombre de la respuesta
#  esperada sigue la convencion "response_<alias del body>".
#  En los ficheros JSON se pueden dejar marcadores {{clave}} que se sustituyen
#  por valores del contexto (ver FrameworkAPI.cuerpoJson).
# ============================================================================

parteVehiculoFechaFutura = jsons/Body/ParteVehiculos/parteVehiculoFechaFutura.json
response_parteVehiculoFechaFutura = jsons/Response/ParteVehiculos/response_parteVehiculoFechafutura.json
